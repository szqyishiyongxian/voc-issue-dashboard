<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="VOC issue analytics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- 三根递减柱：问题量排行 -->
  <rect x="28" y="66" width="16" height="34" rx="4" fill="#ffffff" opacity="0.55"/>
  <rect x="52" y="48" width="16" height="52" rx="4" fill="#ffffff" opacity="0.78"/>
  <rect x="76" y="30" width="16" height="70" rx="4" fill="#ffffff"/>
  <!-- 一条下行趋势折线，暗示问题收敛 -->
  <path d="M26 44 L50 36 L74 40 L100 22" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <circle cx="100" cy="22" r="5" fill="#ffffff"/>
</svg>
